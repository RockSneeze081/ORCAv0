name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sounddevice (imported by main.py / decoder/capture.py) wraps
      # PortAudio; its Linux wheel doesn't always bundle the shared
      # library the way the macOS/Windows ones do, so install it via
      # apt rather than find out from a red CI run.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
